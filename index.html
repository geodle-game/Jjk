<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JJK Knowledge Test </title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="sidebar">
  <div class="vertical-title">
    <span>呪</span><span>術</span><span>廻</span><span>戦</span>
  </div>
  <div class="side-label">Knowledge<br>Test</div>
</aside>

<main class="main">
  <header>
    <h1>Jujutsu Kaisen Knowledge Test</h1>
    <p class="subtitle">Questions scale in difficulty. One attempt only — localStorage seals your fate.</p>
    <div id="progress-bar"><div id="progress-fill"></div></div>
  </header>

  <div id="quiz-container">
    <!-- Questions injected by JS -->
  </div>

  <div id="result-screen" class="hidden">
    <h2>Test Complete</h2>
    <p id="score-text"></p>
    <p class="lock-msg">This browser has already taken the test. No retries. Ever.</p>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
